# Add inside the existing HTTPS server block. The native /api/ route is unchanged.
location = /agent-studio-entry.js {
    proxy_pass http://127.0.0.1:8799;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}
location = /studio {
    return 302 /studio/;
}
# Original files use a separate bounded upload; chat and all other APIs stay 512k.
location = /studio/documents/upload {
    proxy_pass http://127.0.0.1:8799;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_hide_header Set-Cookie;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 11m;
}
location ^~ /studio/ {
    proxy_pass http://127.0.0.1:8799;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_hide_header Set-Cookie;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 512k;
}
