<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>核对流程变更</title><link rel="stylesheet" href="/studio/process-change/style.css"><script type="module" src="/studio/process-change/app.js"></script></head>
<body><main><a href="/studio/">← 返回工作台</a><header><p class="eyebrow">业务变更 · 人工确认</p><h1 id="title">核对本次变更</h1><p>请核对完整内容与依据。确认后将更新对应的中台业务记录。</p></header>
<p id="message" role="status" aria-live="polite">正在读取当前登录人的预览…</p>
<section id="summary" hidden></section><section id="changes" hidden><h2>将保存的内容</h2><p>新增或修改的字段已标记；其余内容保持原值。</p><div id="fields"></div></section>
<section id="basis" hidden><h2>修改依据与待核查项</h2><div id="evidence"></div></section>
<section id="review" hidden><label class="approval"><input id="approved" type="checkbox">我已核对修改内容、关联记录与来源依据，确认执行本次变更。</label><div class="actions"><button id="confirm" disabled>确认并保存</button><button id="cancel" class="secondary">取消本次变更</button></div><p class="hint">需要修改时，请先取消本次预览，回到对话提出更正，再核对新预览。未确认、关闭页面或超时都不会执行。</p></section>
<button id="refresh" class="secondary">查询当前状态</button></main></body></html>
