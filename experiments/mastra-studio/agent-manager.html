<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>agent 管理 · DOON</title><link rel="stylesheet" href="/studio/brand.css"><link rel="stylesheet" href="/studio/manage/style.css"></head>
<body class="agent-manager-page">
 <div class="doon-studio-banner"><a href="/studio/agents">← 返回 agent 工作台</a><span>岗位配置</span></div>
 <main class="am-main">
  <header class="am-heading"><div><p class="am-eyebrow">DOON · agent 工作台</p><h1>agent 管理</h1><p>配置岗位、职责和工具，让每个 agent 做好自己的工作。</p></div><button class="am-primary" id="new-agent">＋ 新建 agent</button></header>
  <section class="am-toolbar"><label for="agent-search">查找 agent</label><input id="agent-search" type="search" placeholder="搜索名称或职责"><span id="model-status"></span></section>
  <p id="page-status" role="status" aria-live="polite">正在读取配置…</p>
  <section id="agent-list" class="am-grid" aria-label="agent 列表"></section>
 </main>
 <dialog id="agent-dialog" aria-labelledby="dialog-title">
  <form id="agent-form">
   <header class="am-dialog-header"><div><p class="am-eyebrow">岗位配置</p><h2 id="dialog-title">新建 agent</h2></div><button type="button" id="close-dialog" class="am-quiet" aria-label="关闭配置">关闭</button></header>
   <div class="am-dialog-body">
    <label class="am-field">agent 名称<input name="name" maxlength="80" required placeholder="例如：工程图纸助手"></label>
    <label class="am-field">职责简介<input name="description" maxlength="500" placeholder="用一句话说明这个岗位负责什么"></label>
    <section class="am-instructions" aria-label="系统 prompt 配置">
     <h3>系统 prompt · 职责与回答要求</h3>
     <p class="am-muted">按从上到下的顺序组合岗位文字和公共 prompt。引用保留关联，公共 prompt 发布更新后，使用它的 agent 会读取新的发布内容。</p>
     <div class="am-prompt-picker"><label for="prompt-picker">引用公共 prompt</label><select id="prompt-picker"><option value="">选择已发布的 prompt</option></select><button type="button" id="add-prompt">添加引用</button></div>
     <div class="am-prompt-links"><a href="/studio/prompts" target="_blank" rel="noopener">管理提示词库 ↗</a><button type="button" id="refresh-prompts">刷新列表</button><button type="button" id="add-instruction">添加岗位文字</button></div>
     <p class="am-muted" id="prompt-options-status"></p>
     <div id="instruction-blocks"></div>
    </section>
    <fieldset><legend>可使用的工具</legend><p class="am-muted">只开放已经接入的工具。模型、账号权限和业务写入边界仍由后台控制。</p><div id="tool-options" class="am-tools"></div></fieldset>
    <section id="history-section" hidden><label class="am-field">历史版本<select id="history-version"><option value="">选择历史版本</option></select></label><button type="button" id="restore-version" class="am-quiet">恢复为新草稿</button></section>
    <p id="form-status" role="status" aria-live="polite"></p>
   </div>
   <footer class="am-dialog-footer"><a id="open-editor" href="#" hidden>进入配置编辑器</a><span id="draft-state"></span><button type="submit" id="save-draft">保存草稿</button><button type="button" id="publish-agent" class="am-primary">保存并发布</button></footer>
  </form>
 </dialog>
 <script type="module" src="/studio/manage/app.js"></script>
</body></html>
