name: Public repository path hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-paths:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - name: Verify the guard using isolated synthetic Git repositories
        run: node tests/public-repository.mjs
      - name: Check only committed public file paths
        run: node scripts/check-public-repository.mjs --ref HEAD
