name: Native middle-platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      DOON_BUILD_DIR: test-output/native-ci-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Business tests with synthetic data
        run: node tests/run.mjs
      - name: TypeScript
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Package integrity tests
        run: node tests/native-release.mjs
      - name: Build in an isolated directory
        run: node standalone/build.mjs
      - name: Native HTTP and gateway tests
        run: |
          node standalone/test.mjs
          node standalone/test-employee-gateway.mjs
          node standalone/test-supplier-gateway.mjs
          node standalone/test-code-update.mjs
      - name: Package and test the extracted runtime
        run: node scripts/package-native-release.mjs
      - name: Upload validated main build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doon-native-linux-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-output/native-release/*.tar.gz
            test-output/native-release/SHA256SUMS
            test-output/native-release/release.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
