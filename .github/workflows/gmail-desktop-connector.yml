name: Gmail desktop connector
on:
  push:
    paths: ['integrations/gmail-desktop-connector/**', 'integrations/chatwoot/gateway.mjs', 'tests/chatwoot-gateway.mjs', '.github/workflows/gmail-desktop-connector.yml']
  pull_request:
    paths: ['integrations/gmail-desktop-connector/**', 'integrations/chatwoot/gateway.mjs', 'tests/chatwoot-gateway.mjs', '.github/workflows/gmail-desktop-connector.yml']
permissions:
  contents: read
jobs:
  synthetic-connector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: integrations/gmail-desktop-connector
      - run: npm test
        working-directory: integrations/gmail-desktop-connector
  gateway-scope:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/chatwoot-gateway.mjs
