# Include only inside Chatwoot's existing /vite/ proxy location.
# Keep employee authorization in the gateway; this adds no public asset bypass.
gzip on;
gzip_types application/javascript text/javascript text/css image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 4;
gzip_vary on;
gzip_proxied any;
proxy_set_header Accept-Encoding "";
