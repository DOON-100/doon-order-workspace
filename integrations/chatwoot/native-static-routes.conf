# Add only these locations inside the existing HTTPS server block.
# Keep the middle platform's /assets/ and other routes unchanged.
location ^~ /dashboard/images/ {
    proxy_pass http://127.0.0.1:18900;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
}
location ^~ /audio/dashboard/ {
    proxy_pass http://127.0.0.1:18900;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
}
